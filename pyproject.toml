[project]
name = "agentbell"
version = "1.0.0"
description = "Windows notification tool for Claude Code CLI hooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
]

[project.scripts]
agentbell = "agentbell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbell"]
